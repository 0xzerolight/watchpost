version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Security fixes land as one PR: ci.yml's audit job stays red while any
      # advisory remains, so a PR per crate could never pass on its own.
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      gh-actions:
        patterns:
          - "*"
