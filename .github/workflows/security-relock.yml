name: Security Relock

# ci.yml's audit job fails on any RustSec advisory against Cargo.lock, and most
# RustSec advisories never reach GitHub's advisory database, so Dependabot does
# not fix them. This audits the lock once a day and, when a crate has a patched
# release, moves it with `cargo update` and opens an auto-merging PR. The merge
# still waits for main's required checks.

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: security-relock

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit the lock
        id: audit
        run: |
          set -euo pipefail
          # cargo audit exits 1 when it finds anything; a real failure leaves no JSON and jq fails below.
          cargo audit --json > "$RUNNER_TEMP/audit.json" || true
          # Only advisories with a patched release: there is nothing to move to for the others.
          fixable='.vulnerabilities.list[] | select(.versions.patched | length > 0)'
          jq -r "$fixable | \"\(.package.name)@\(.package.version)\"" "$RUNNER_TEMP/audit.json" \
            | sort -u > "$RUNNER_TEMP/crates.txt"
          jq -r "$fixable | \"- \(.package.name) \(.package.version): \(.advisory.id)\"" \
            "$RUNNER_TEMP/audit.json" > "$RUNNER_TEMP/advisories.txt"
          cat "$RUNNER_TEMP/advisories.txt"
          if [ -s "$RUNNER_TEMP/crates.txt" ]; then
            echo "vulnerable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the vulnerable crates
        if: steps.audit.outputs.vulnerable == 'true'
        run: |
          set -euo pipefail
          # name@version, not a bare name: a bare one is ambiguous when the lock
          # holds two versions of the crate. Edition 2024's resolver keeps every
          # move within rust-version, which the msrv job checks.
          update_args=()
          while IFS= read -r crate; do
            update_args+=(-p "$crate")
          done < "$RUNNER_TEMP/crates.txt"
          cargo update "${update_args[@]}"
          git diff --stat

      - name: Open the relock PR
        if: steps.audit.outputs.vulnerable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch=security-relock
          title="fix(deps): update crates with known vulnerabilities"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "$title" -m "$(cat "$RUNNER_TEMP/advisories.txt")"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/advisories.txt"
          fi
          gh pr merge "$branch" --auto --squash --delete-branch
          # GitHub holds the pull_request CI run on a PR opened or pushed with GITHUB_TOKEN until it is
          # approved (conclusion action_required), and the required checks only count that run.
          # Wait for it to appear and approve it.
          head_sha="$(git rev-parse HEAD)"
          for _ in $(seq 30); do
            run="$(gh run list --workflow ci.yml --event pull_request --commit "$head_sha" \
              --json databaseId,conclusion --jq '.[0] | select(.) | "\(.databaseId) \(.conclusion)"')"
            [ -n "$run" ] && break
            sleep 10
          done
          if [ -z "$run" ]; then
            echo "::error::no pull_request CI run appeared for $head_sha"
            exit 1
          fi
          read -r run_id conclusion <<< "$run"
          if [ "$conclusion" = "action_required" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve"
          fi
