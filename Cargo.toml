[package]
name = "watchpost"
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
description = "Self-hosted GitHub repo metrics with a promo-event timeline"
repository = "https://github.com/0xzerolight/watchpost"
license = "AGPL-3.0-or-later"
readme = "README.md"
keywords = ["github", "metrics", "analytics", "self-hosted"]
categories = ["web-programming::http-server", "command-line-utilities"]

[dependencies]
axum = "0.8"
maud = { version = "0.27", features = ["axum"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-cron-scheduler = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# The IANA database compiled into the binary. Deliberately not `chrono::Local`:
# the runtime image is alpine without tzdata, where reading /etc/localtime
# resolves to UTC — the exact failure WATCHPOST_TZ exists to fix. No
# `filter-by-regex`: it fixes the zone set at build time, which would defeat a
# runtime setting.
chrono-tz = "0.10"
tower-http = { version = "0.6", features = ["catch-panic", "compression-gzip", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-logfmt = "0.3"
thiserror = "2"
url = "2"
dotenvy = "0.15"
pulldown-cmark = "0.13"
getrandom = "0.3"
subtle = "2"

[dev-dependencies]
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
temp-env = "0.3"
tempfile = "3"

# The binary embeds every asset and ships as one file, so the ~2min build is a
# one-off cost paid for a smaller, faster artifact. Deliberately no
# panic = "abort": the catch-panic layer has to unwind to turn a handler panic
# into a 500 instead of taking the process down.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
